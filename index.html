<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Electric Man - Handyman</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="./styles/styles.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="top-bar">
        <div class="top-bar__content">
          <p class="top-bar__phone">
            <strong>Call Now :</strong>
            +1 (123) 456-7890
          </p>

          <p class="top-bar__offer">24/7 Open Service & 50% off for now!</p>

          <div class="top-bar__socials">
            <a href="#">
              <img src="./assets/header/fb.png" alt="fb" />
            </a>

            <a href="#">
              <img src="./assets/header/instagram.png" alt="instagram" />
            </a>

            <a href="#">
              <img src="./assets/header/snapchat.png" alt="snapchat" />
            </a>

            <a href="#">
              <img src="./assets/header/whatsapp.png" alt="whatsapp" />
            </a>
          </div>
        </div>
      </div>

      <nav class="main-navbar">
        <div class="main-navbar__content">
          <a class="main-navbar__logo" href="./index.html">
            <img src="./assets/common/main_logo.png" alt="main logo" />
            <span>ElectricMan</span>
          </a>

          <ul class="main-navbar__links">
            <li>
              <a class="active" href="./index.html">Home</a>
            </li>

            <li>
              <a href="./about.html">About Us</a>
            </li>

            <li>
              <a href="#booking">Booking</a>
            </li>

            <li>
              <a href="./services.html">Services</a>
            </li>

            <li>
              <a href="#blogs">Blogs</a>
            </li>

            <li>
              <a href="./contact.html">Contact Us</a>
            </li>
          </ul>

          <div class="main-navbar__actions">
            <button class="search-button" type="button">
              <img src="./assets/header/search.png" alt="search" />
            </button>

            <a class="appointment-button animated-button" href="#booking">
              <img
                class="animated-button__icon animated-button__icon--hover"
                src="./assets/common/paper_airplane_yellow_rotated.png"
                alt="paper airplane yellow"
              />

              <span class="animated-button__text">Book Appointment</span>

              <img
                class="animated-button__icon animated-button__icon--default"
                src="./assets/common/paper_airplane_black.png"
                alt="paper airplane black"
              />
            </a>
          </div>
        </div>
      </nav>
    </header>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
